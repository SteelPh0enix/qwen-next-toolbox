name: qwen-next-toolbox

x-toolbox: &toolbox
  image: qwen-next-toolbox:latest
  build:
    context: .
    args:
      # ./setup.sh -u bumps this so the layer fetching the upstream installer (and with it the
      # pins) is rebuilt; the ROCm layers above it stay cached. The id it used is kept in
      # .strix-build-id and reused by later runs, because BUILD_ID=0 would match the installer
      # layer of the first build and move :latest back to its pins. Builds that bypass setup.sh
      # land here. STRIX_HALO_REF pins the installer itself - the rollback path, see the README
      # update guide.
      BUILD_ID: ${BUILD_ID:-0}
      STRIX_HALO_REF: ${STRIX_HALO_REF:-main}
  # Rootless-friendly: no privileged mode, no added capabilities. The GIDs below are only
  # needed when the container runs unprivileged and your udev rules are stricter than 0666.
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - "${STRIX_RENDER_GID:-303}"
    - "${STRIX_VIDEO_GID:-26}"
  security_opt:
    - seccomp=unconfined
  shm_size: "${STRIX_SHM_SIZE:-8g}"
  ulimits:
    memlock:
      soft: -1
      hard: -1
  # Rootless Docker: container uid 0 *is* your host uid, so the default keeps every
  # file it writes on the host owned by you. For a rootful system daemon set
  # STRIX_USER=$(id -u):$(id -g) instead.
  user: "${STRIX_USER:-root}"
  volumes:
    - ${STRIX_STATE_DIR:-./state}:/home/strix
    - ${STRIX_MODEL_DIR:-./models}:/models
    # Optional second weights mount for weights that already live elsewhere on the host; name a
    # file inside it from MODEL_FILE with an absolute /models-extra/... path. Falls back to
    # STRIX_MODEL_DIR when STRIX_MODEL_DIR_EXTRA is empty.
    - ${STRIX_MODEL_DIR_EXTRA:-${STRIX_MODEL_DIR:-./models}}:/models-extra
    - ./scripts/serve.sh:/opt/toolbox/serve.sh:ro
  environment:
    HF_TOKEN: ${HF_TOKEN:-}

services:
  # One-off build + model download. Re-running it is cheap: everything it
  # produces lives in STRIX_STATE_DIR / STRIX_MODEL_DIR and is verified, not redone.
  setup:
    <<: *toolbox
    profiles: ["setup"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      JOBS: ${JOBS:-16}
    command:
      [
        "bash",
        "/opt/strix-halo/install-flash-next.sh",
        "--skip-packages",
        "--model-dir",
        "/models",
      ]

  # The tuned server: 256k context, 16384 batch/ubatch, MTP draft width 3 + draftless ngram-mod.
  server:
    <<: *toolbox
    ports:
      - "${STRIX_PORT:-8080}:8080"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      CTX_SIZE: ${CTX_SIZE:-262144}
      BATCH_SIZE: ${BATCH_SIZE:-16384}
      UBATCH_SIZE: ${UBATCH_SIZE:-16384}
      PARALLEL: ${PARALLEL:-1}
      MTP_N_MAX: ${MTP_N_MAX:-3}
      NGRAM_MOD: ${NGRAM_MOD:-1}
      NGRAM_MOD_N_MATCH: ${NGRAM_MOD_N_MATCH:-}
      NGRAM_MOD_N_MIN: ${NGRAM_MOD_N_MIN:-}
      NGRAM_MOD_N_MAX: ${NGRAM_MOD_N_MAX:-}
      ENABLE_RETAINED_PM4: ${ENABLE_RETAINED_PM4:-1}
      GPU_MAX_HW_QUEUES: ${GPU_MAX_HW_QUEUES:-1}
      MODEL_FILE: ${MODEL_FILE:-}
      DRAFT_MODEL: ${DRAFT_MODEL:-}
      MMPROJ_FILE: ${MMPROJ_FILE:-}
      MODEL_ALIAS: ${MODEL_ALIAS:-Qwen 3.8 Flash Next}
    entrypoint: ["/opt/toolbox/serve.sh"]
    command: ["--host", "0.0.0.0", "--port", "8080"]
